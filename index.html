<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Quiz</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #050a14;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: white;
        }

        /* Animated Liquid Background */
        .bg-blobs { position: absolute; width: 100%; height: 100%; z-index: -1; filter: blur(80px); }
        .blob { position: absolute; border-radius: 50%; animation: move 20s infinite alternate; }
        .b1 { width: 500px; height: 500px; background: #0047ff; top: -10%; left: -10%; }
        .b2 { width: 400px; height: 400px; background: #00c2ff; bottom: -10%; right: -5%; animation-delay: -5s; }
        .b3 { width: 300px; height: 300px; background: #5e5ce6; top: 40%; left: 30%; animation-delay: -2s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.2); }
        }

        /* Glass Container */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            width: 90%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            min-height: 550px;
        }

        /* Timer UI */
        .timer-container {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: conic-gradient(var(--ios-blue) 0%, transparent 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s linear;
        }
        .timer-inner {
            width: 37px;
            height: 37px;
            background: #1c1c1e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        header h1 { font-size: 2.2rem; margin-bottom: 5px; color: #fff; font-weight: 800; }
        header p { color: rgba(255,255,255,0.5); margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            text-align: left;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        .btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); border-color: var(--ios-blue); }

        .high-score-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.65rem;
            background: var(--ios-green);
            padding: 2px 8px;
            border-radius: 10px;
            color: white;
        }

        .option {
            width: 100%; margin-bottom: 12px; padding: 18px; border-radius: 15px; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: white; cursor: pointer; transition: 0.2s; text-align: left; font-size: 1rem;
        }
        .option:hover:not(:disabled) { background: rgba(255,255,255,0.08); transform: scale(1.01); }
        .option.correct { background: rgba(52, 199, 89, 0.25); border-color: var(--ios-green); }
        .option.wrong { background: rgba(255, 59, 48, 0.25); border-color: var(--ios-red); }

        .explanation {
            background: rgba(0, 122, 255, 0.12); border-left: 4px solid var(--ios-blue);
            padding: 15px; border-radius: 12px; margin-top: 15px; display: none; animation: fadeIn 0.4s;
            font-size: 0.95rem; line-height: 1.5;
        }

        .next-btn {
            background: var(--ios-blue); color: white; border: none; padding: 14px 30px;
            border-radius: 15px; font-weight: 700; cursor: pointer; float: right; margin-top: 20px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>

        let currentS = "", currentC = "", currentI = 0, score = 0, timerObj = null, timeLeft = 30;
        const app = document.getElementById('app-content');
        const title = document.getElementById('main-title');
        const sub = document.getElementById('sub-title');
        const timerBox = document.getElementById('timer-box');

        function startTimer() {
            clearInterval(timerObj);
            timeLeft = 30;
            updateTimerUI();
            timerObj = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerObj);
                    check(-1); 
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-text').innerText = timeLeft;
            const percent = (timeLeft / 30) * 100;
            document.getElementById('timer-circle').style.background = `conic-gradient(var(--ios-blue) ${percent}%, transparent 0%)`;
        }

        function init() {
            timerBox.classList.add('hidden');
            title.innerText = "Board Quiz";
            sub.innerText = "Select Subject";
            let html = '<div class="grid">';
            Object.keys(quizData).forEach(s => html += `<button class="btn" onclick="showCh('${s}')">${s}</button>`);
            app.innerHTML = html + '</div>';
        }

        function showCh(s) {
            currentS = s;
            sub.innerText = `${s} Revision`;
            let html = '<div class="grid">';
            Object.keys(quizData[s]).forEach(c => {
                const best = getHighScore(c);
                html += `
                <button class="btn" onclick="startQ('${c}')">
                    ${c}
                    ${best > 0 ? `<span class="high-score-tag">Best: ${best}</span>` : ''}
                </button>`;
            });
            app.innerHTML = html + `</div><button class="next-btn" onclick="init()" style="float:none; width:100%; background:rgba(255,255,255,0.1); margin-top:20px;">Back</button>`;
        }

        function startQ(c) {
            currentC = c; currentI = 0; score = 0;
            timerBox.classList.remove('hidden');
            showQ();
        }

        function showQ() {
            const qData = quizData[currentS][currentC][currentI];
            sub.innerText = `${currentC} (${currentI + 1}/15)`;
            let html = `<div style="font-size:1.3rem; margin-bottom:20px; font-weight:600; line-height:1.4;">${qData.q}</div>`;
            qData.options.forEach((o, i) => html += `<button class="option" onclick="check(${i})">${o}</button>`);
            app.innerHTML = html + `<div id="exp" class="explanation"></div><button id="next" class="next-btn hidden" onclick="next()">Next</button>`;
            startTimer();
        }

        window.check = (idx) => {
            clearInterval(timerObj);
            const qData = quizData[currentS][currentC][currentI];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.disabled = true);
            
            if (idx === qData.answer) {
                btns[idx].classList.add('correct');
                score++;
            } else {
                if(idx !== -1) btns[idx].classList.add('wrong');
                btns[qData.answer].classList.add('correct');
            }
            
            const exp = document.getElementById('exp');
            exp.innerHTML = `<strong>Board Note:</strong> ${qData.explanation}`;
            exp.style.display = 'block';
            document.getElementById('next').classList.remove('hidden');
        };

        window.next = () => {
            currentI++;
            if (currentI < 15) showQ();
            else finish();
        }

        function finish() {
            saveHighScore(currentC, score);
            timerBox.classList.add('hidden');
            sub.innerText = "Exam Completed";
            const percent = Math.round(score/15*100);
            app.innerHTML = `<div style="text-align:center; padding: 20px;">
                <h2 style="font-size:3.5rem; color:${percent >= 80 ? 'var(--ios-green)' : 'white'};">${percent}%</h2>
                <p style="font-size:1.2rem; opacity:0.8;">You got ${score} out of 15 correct.</p>
                <div style="margin-top:20px; font-size:0.9rem; opacity:0.6;">High Score for this chapter: ${getHighScore(currentC)}/15</div>
                <button class="btn" onclick="init()" style="margin-top:30px; width:100%; text-align:center;">Return Home</button>
            </div>`;
        }

        init();
    </script>
